<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZERO COFFEE - Menu</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f8f1e9;
        color: #333;
        line-height: 1.5;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        background: #1e40af;
        color: white;
        text-align: center;
        padding: 20px;
        border-radius: 12px 12px 0 0;
        font-size: 2rem;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #fffaf0;
        border-radius: 0 0 12px 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .column {
        padding: 25px 20px;
      }

      .column.left {
        background: #fefaf5;
      }
      .column.right {
        background: #f5f9ff;
      }

      h2 {
        color: #1e40af;
        font-size: 1.5rem;
        margin-bottom: 18px;
        padding-bottom: 8px;
        border-bottom: 2px solid #d1d5db;
      }

      .item {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
      }

      .item img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        flex-shrink: 0;
      }

      .name-price {
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.05rem;
      }

      .name {
        font-weight: 500;
      }

      .price {
        color: #dc2626;
        font-weight: bold;
        min-width: 50px;
        text-align: right;
      }

      .special {
        color: #c2410c;
        font-weight: 600;
      }

      .footer {
        text-align: center;
        margin-top: 20px;
        color: #666;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .menu-grid {
          grid-template-columns: 1fr;
        }
        .column.left,
        .column.right {
          background: #fffaf0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">ZERO COFFEE</div>

      <div class="menu-grid">
        <!-- Cột trái -->
        <div class="column left">
          <h2>Cà phê phin</h2>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=100"
              alt="Phin đen"
            />
            <div class="name-price">
              <span class="name">Phin đen</span>
              <span class="price">25k</span>
            </div>
          </div>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1444418185997-1145401129e8?w=100"
              alt="Phin sữa"
            />
            <div class="name-price">
              <span class="name">Phin sữa</span>
              <span class="price">30k</span>
            </div>
          </div>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1512568400610-62da28bc8a13?w=100"
              alt="Phin muối"
            />
            <div class="name-price">
              <span class="name special">Phin muối</span>
              <span class="price">35k</span>
            </div>
          </div>

          <h2>Cà phê máy</h2>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=100"
              alt="Đen máy"
            />
            <div class="name-price">
              <span class="name">Đen máy</span>
              <span class="price">30k</span>
            </div>
          </div>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1577968898878-3f58e3f94c5b?w=100"
              alt="Nâu máy"
            />
            <div class="name-price">
              <span class="name">Nâu máy</span>
              <span class="price">35k</span>
            </div>
          </div>

          <h2>Trà hoa quả</h2>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1622484212850-eb596d0f1777?w=100"
              alt="Trà hibiscus"
            />
            <div class="name-price">
              <span class="name">Trà hibiscus</span>
              <span class="price">35k</span>
            </div>
          </div>
          <!-- Thêm các món khác tương tự nếu cần -->
        </div>

        <!-- Cột phải -->
        <div class="column right">
          <h2>Freeze</h2>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1622597478994-27a0a9b175f9?w=100"
              alt="Freeze matcha"
            />
            <div class="name-price">
              <span class="name special">Freeze matcha</span>
              <span class="price">50k</span>
            </div>
          </div>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=100"
              alt="Freeze việt quất"
            />
            <div class="name-price">
              <span class="name">Freeze việt quất</span>
              <span class="price">50k</span>
            </div>
          </div>

          <h2>Sữa chua</h2>
          <div class="item">
            <img
              src="https://images.unsplash.com/photo-1563329346-5e4e6b0a0e6f?w=100"
              alt="Sữa chua trà xanh"
            />
            <div class="name-price">
              <span class="name">Sữa chua trân châu</span>
              <span class="price">35k</span>
            </div>
          </div>

          <h2>Topping</h2>
          <div class="item">
            <div class="name-price" style="width: 100%">
              <span class="name">Trân châu trắng</span>
              <span class="price">7k</span>
            </div>
          </div>
          <div class="item">
            <div class="name-price" style="width: 100%">
              <span class="name">Nhãn đam</span>
              <span class="price">7k</span>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">Giá tiền VNĐ cho bảng giá ZERO COFFEE</div>
    </div>
  </body>
</html>
